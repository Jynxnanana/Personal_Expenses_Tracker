name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'assets/**'
      - 'lib/**'
      - 'pubspec.*'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHCCI-ExpenseMate-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14


  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: CHCCI-ExpenseMate-Android-APK

      - name: Publish APK download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_apk="CHCCI-ExpenseMate-Android.apk"
          cp "app-release.apk" "$release_apk"
          sha256sum "$release_apk" > "$release_apk.sha256"
          release_tag="expensemate-build-${GITHUB_RUN_NUMBER}"
          gh release create "$release_tag" \
            "$release_apk" \
            "$release_apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CHCCI ExpenseMate Android APK (build ${GITHUB_RUN_NUMBER})" \
            --notes "Android APK built from commit ${GITHUB_SHA}. Download the APK below and install it on your Android device." \
            --target "$GITHUB_SHA" \
            --latest
